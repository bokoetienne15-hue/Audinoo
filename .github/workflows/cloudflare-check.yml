name: Validate Cloudflare migration

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

jobs:
  build-and-check-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx wrangler deploy --dry-run
